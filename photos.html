<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Your CSS file -->
<link rel="stylesheet" href="style.css">
</head>

<body>
<audio id="bgMusic" src="music.mp3" loop></audio>
<div id="starLayer"></div>
<div class="photo-page">
    <h2>Tap anywhere to reveal memories ✨</h2>

    <div class="photo-container">
        <img id="leftPhoto" class="photo left">
        <img id="rightPhoto" class="photo right">
    </div>
</div>

<div id="particles"></div>
<div id="flash" class="flash"></div>
<script src="script.js?v=3"></script>

<div id="pauseScreen" class="pause-screen">
    Every memory tells a story ✨
</div>
<script>
const music = document.getElementById("bgMusic");

window.addEventListener("load", () => {

    if(localStorage.getItem("musicStarted") === "true"){
        music.play().catch(()=>{});
    }

});
</script>
</body>
</html>
