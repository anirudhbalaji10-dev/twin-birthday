<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishes</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Your CSS file -->
<link rel="stylesheet" href="style.css">

</head>

<body>
<audio id="bgMusic" src="music.mp3" loop></audio>
<div class="page-center">

    <p class="small-line">A message from the heart</p>

    <h1>Special Wishes 💖</h1>

    <p class="wish-text">
        May your smiles always stay bright, your bond stay strong,
        and every year bring beautiful memories together.
        May life bring both of you endless happiness and beautiful adventures.
    </p>

    <a href="final.html" class="portal-btn">Final Surprise</a>

</div>
<script>
const music = document.getElementById("bgMusic");

// Restore music time
window.addEventListener("load", () => {

    const started = localStorage.getItem("musicStarted");
    const savedTime = localStorage.getItem("musicTime");

    if (started === "true") {

        if (savedTime) {
            music.currentTime = parseFloat(savedTime);
        }

        music.play().catch(()=>{});
    }
});

// Save current time before leaving page
window.addEventListener("beforeunload", () => {
    localStorage.setItem("musicTime", music.currentTime);
});
</script>
</body>
</html>
