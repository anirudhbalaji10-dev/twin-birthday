<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Your CSS file -->
<link rel="stylesheet" href="style.css">

</head>
<body>
<audio id="bgMusic" src="music.mp3" loop></audio>
<div id="particles"></div>
<div class="page-center">
    <p class="small-line">A moment made just for you</p>
    <h1>Two Stars. One Special Day ✨</h1>
    <button id="enterBtn" class="portal-btn">Enter</button>
</div>
<script>
const enterBtn = document.getElementById("enterBtn");
const music = document.getElementById("bgMusic");

enterBtn.addEventListener("click", () => {

    localStorage.setItem("musicStarted", "true");
    localStorage.setItem("musicTime", 0);

    music.currentTime = 0;

    music.play().then(() => {
        window.location.href = "title.html";
    });

});
</script>
<script>
const music = document.getElementById("bgMusic");

// Restore music time
window.addEventListener("load", () => {

    const started = localStorage.getItem("musicStarted");
    const savedTime = localStorage.getItem("musicTime");

    if (started === "true") {

        if (savedTime) {
            music.currentTime = parseFloat(savedTime);
        }

        music.play().catch(()=>{});
    }
});

// Save current time before leaving page
window.addEventListener("beforeunload", () => {
    localStorage.setItem("musicTime", music.currentTime);
});
</script>
</body>
</html>
